[package]
name = "configx"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Layered configuration store: in-memory key-value snapshot, multi-source merge, change watch and secret redaction"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bytechainx/configx"
homepage = "https://github.com/bytechainx/configx"
documentation = "https://docs.rs/configx"
readme = "README.md"
keywords = ["config", "configuration", "toml", "layered", "watch"]
categories = ["config", "development-tools"]
include = ["src/**/*", "tests/**/*", "examples/**/*", "README.md", "LICENSE-*", "Cargo.toml"]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
